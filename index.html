<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fb"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1230"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Study for My Test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: columna única tipo app (máx 560px), barra de acción fija abajo en lecciones */
:root{
  --navy:#14245a; --red:#c8202f; --bg:#f4f6fb; --card:#ffffff; --fg:#121a33; --muted:#5d6788; --line:#dde2ef;
  --ok:#177a42; --okbg:#e3f6ea; --bad:#c22636; --badbg:#fde7e9; --tile:#eef1f8; --gold:#946800; --on:#fff;
  --display:"Montserrat",system-ui,sans-serif; --body:"Lexend",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#8fa6ff; --red:#ff5a66; --bg:#0c1230; --card:#151d42; --fg:#eef1fb; --muted:#a2abcb; --line:#2a3566;
  --ok:#4fd28a; --okbg:#123a29; --bad:#ff6b77; --badbg:#3e1520; --tile:#1d2753; --gold:#ffc83d; --on:#0c1230; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#8fa6ff; --red:#ff5a66; --bg:#0c1230; --card:#151d42; --fg:#eef1fb; --muted:#a2abcb; --line:#2a3566;
  --ok:#4fd28a; --okbg:#123a29; --bad:#ff6b77; --badbg:#3e1520; --tile:#1d2753; --gold:#ffc83d; --on:#0c1230; color-scheme:dark}
html,body{height:100%;overflow-x:clip}
html{scroll-padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
*{-webkit-tap-highlight-color:transparent}
button,.tl,.opt{touch-action:manipulation}
.tl,.opt,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 120px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:600;background:var(--navy);color:var(--bg);box-shadow:0 4px 0 color-mix(in srgb,var(--navy) 60%,#000);width:100%;font-size:17px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--navy) 60%,#000)}
.btn.red{background:var(--red);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#000);color:var(--on)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:none;border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.small{font-size:13px}
input.ans{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.top{display:flex;align-items:center;gap:12px;padding-block:6px 14px;flex-wrap:wrap}
.top img{width:52px;height:52px;border-radius:50%;background:#fff}
.top .who{flex:1;min-width:80px;overflow-wrap:anywhere}
.top .who b{font-family:var(--display);font-size:17px}
.stats{display:flex;gap:10px;font-weight:600;font-variant-numeric:tabular-nums}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
.hero{background:var(--navy);color:var(--bg);border-radius:20px;padding:18px;display:grid;gap:10px;margin-bottom:22px}
.hero h2{font-size:20px}
.bar{height:10px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .3s}
.home{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
.side{display:grid;gap:12px;align-content:start}
.path{min-width:0}
.unit{margin:22px 0 10px;display:flex;align-items:center;gap:12px}
.path .unit:first-child{margin-top:0}
.unit .un{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--red);color:#fff;font-family:var(--display);font-weight:900;font-size:20px}
.unit h3{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.ugrid{display:grid;gap:8px}
.lesson .go{font-size:13px;font-weight:600;color:var(--red);white-space:nowrap}
.card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.card:disabled{opacity:.55;cursor:default}
.cnum{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:900;background:var(--navy);color:var(--bg)}
.card .txt{flex:1;min-width:0}.card b{display:block}
.score{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.score>div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid}
.score .eyebrow{color:var(--red);font-weight:600;opacity:1;min-height:2.6em}
.trx[open]{max-height:35vh;overflow:auto}
.sc{font-family:var(--display);font-weight:900;font-size:30px;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.2}
.pic{display:flex;justify-content:center;margin:0 0 16px}.pic span{font-size:84px;line-height:1.1;letter-spacing:4px}.pic img{width:120px;height:auto;filter:drop-shadow(0 4px 10px color-mix(in srgb,var(--navy) 25%,transparent))}
.dlg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}.spk.wide{width:auto;padding:0 18px;font-size:16px;font-weight:600;font-family:var(--body)}
.wrongsent{text-decoration:underline wavy var(--bad);text-decoration-thickness:2px;text-underline-offset:6px;color:var(--fg)}
.trx{margin-top:8px;font-size:14px}.trx summary{cursor:pointer;padding:12px 0;color:var(--navy);font-weight:600}.trx p{margin:4px 0}
.prog{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}.prog .eyebrow{color:var(--red);font-weight:600}
.urow{display:grid;grid-template-columns:52px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:14px}.ubar{height:12px;border-radius:99px;background:var(--tile);overflow:hidden}.ubar i{display:block;height:100%;background:linear-gradient(90deg,var(--navy),var(--red));border-radius:99px}
.chart{display:block;height:120px;width:auto;max-width:100%}.chart text{font-size:11px;fill:var(--fg);font-family:var(--body);font-weight:600}.chart .ax{fill:var(--muted);font-weight:400}.chart .good{fill:var(--ok)}.chart .low{fill:var(--red)}.chart .pass{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.lnk{min-height:44px;border:0;background:none;color:var(--navy);text-decoration:underline;padding:12px 0;font-size:inherit}
.hero{position:relative;overflow:hidden}
.hero>*{position:relative}
.stripes{position:absolute!important;right:-50px;bottom:-70px;width:180px;height:180px;border-radius:50%;background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--red) 55%,transparent) 0 14px,transparent 14px 28px);opacity:.35}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
@media (min-width:700px){.wrap.mid{max-width:720px}.foot .in{max-width:720px}.qtext{font-size:26px}.lesson{padding:14px 16px}}
@media (min-width:960px){.wrap.wide{max-width:1120px}
 .home{grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:start}
 .side{grid-column:2;grid-row:1;position:sticky;top:16px}
 .path{grid-column:1;grid-row:1}
 .ugrid{grid-template-columns:1fr 1fr}
 .top{padding-block:14px 22px}}
.lesson{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.lesson .num{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--tile);color:var(--navy);font-variant-numeric:tabular-nums}
.lesson.done .num{background:var(--ok);color:var(--on)}
.lesson.next{border:2px solid var(--red)}
.lesson .txt{flex:1;min-width:0}
.lesson .txt b{display:block;font-weight:600}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.special{display:grid;gap:10px;margin-top:26px}
/* lección */
.lhead{display:flex;align-items:center;gap:12px;padding-block:6px 18px}
.lhead .x{border:0;background:none;font-size:26px;color:var(--muted);padding:4px 8px}
.lhead .bar{flex:1;background:var(--line)}
.hearts{color:var(--red);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.qtype{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:6px}
.qtext{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.25;margin-bottom:18px}
.qtext .blank{display:inline-block;min-width:60px;border-bottom:3px solid var(--navy)}
.say{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.spk{border:0;border-radius:16px;background:var(--navy);color:var(--bg);width:64px;height:64px;font-size:26px;box-shadow:0 4px 0 color-mix(in srgb,var(--navy) 60%,#000)}
.spk.slow{width:48px;height:48px;font-size:14px;background:var(--tile);color:var(--navy);box-shadow:none;border:2px solid var(--line)}
.saytxt{font-size:18px;font-weight:500;min-width:0}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:14px;text-align:left;font-size:17px}
.opt .key{display:none;margin-right:10px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
@media (hover:hover) and (pointer:fine){.opt .key{display:inline-block}}
.opt.right,.opt.right[aria-pressed="true"]{border-color:var(--ok);background:var(--okbg)}.opt.wrong[aria-pressed="true"]{border-color:var(--bad);background:var(--badbg)}.opt:disabled{cursor:default;color:var(--fg)}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--tile)}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px 0;border-bottom:2px solid var(--line);margin-bottom:14px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tl{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:8px 12px;font-size:17px}
.tl.used{visibility:hidden}
.mic{display:flex;gap:10px;align-items:stretch;margin-top:10px}
.mic .btn{width:auto;flex:none}
.mic .btn.on{background:var(--red);color:var(--on)}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-top:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:100dvh;overflow-y:auto;overscroll-behavior:contain}
.foot .in{max-width:560px;margin:0 auto;display:grid;gap:10px}
.foot.ok{background:var(--okbg);border-color:transparent}
.foot.bad{background:var(--badbg);border-color:transparent}
.fb h3{font-size:19px}
.foot.ok .fb h3{color:var(--ok)} .foot.bad .fb h3{color:var(--bad)}
.fb p{margin:4px 0 0}
.foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 60%,#000);color:var(--on)}
.foot.bad .btn{background:var(--bad);box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 60%,#000);color:var(--on)}
.tipcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.7}
.tipcard i{color:var(--navy);font-style:normal;font-weight:600}
.result{text-align:center;display:grid;gap:14px;padding-top:30px}
.big{font-family:var(--display);font-weight:900;font-size:56px;color:var(--navy);font-variant-numeric:tabular-nums}
.review{text-align:left;display:grid;gap:8px}
.review div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.login{min-height:80vh;display:grid;align-content:center;gap:18px;text-align:center}
.login img{width:180px;height:180px;margin:0 auto;border-radius:50%;background:#fff;box-shadow:0 6px 24px color-mix(in srgb,var(--navy) 25%,transparent)}
.login h1{font-size:28px;color:var(--navy)}
.rescue{margin:-4px auto 0;display:inline-flex;align-items:center;gap:8px;justify-self:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:500;font-size:15px}
.rescue b{color:var(--ok);font-family:var(--display);font-weight:900;letter-spacing:.06em}
.buoy{width:26px;height:26px;flex:none;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(-12deg) translateY(0)}50%{transform:rotate(12deg) translateY(-3px)}}
.byline{margin:-12px 0 0;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.wkpill{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:99px;padding:2px 10px;margin:2px;font-size:13px}
/* animaciones */
@keyframes qin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes beat{0%,100%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(.9)}}
@keyframes glow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.9)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.qin{animation:qin .32s ease-out both}
.pop{animation:pop .35s ease-out}
.shake{animation:shake .4s ease-in-out}
.foot.ok,.foot.bad{animation:up .25s ease-out}
.hearts.beat{display:inline-block;animation:beat .5s ease-out}
.lhead .bar i{transition:width .5s cubic-bezier(.3,1.4,.5,1);animation:glow .8s ease-out}
.streak{display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--gold) 22%,transparent);color:var(--fg);border-radius:99px;padding:3px 10px;font-weight:600;font-size:14px;animation:rise .35s ease-out both}
.streak b{display:inline-block;animation:wob .6s ease-in-out 2}
.result>*{animation:rise .45s ease-out both}.result>*:nth-child(2){animation-delay:.08s}.result>*:nth-child(3){animation-delay:.16s}.result>*:nth-child(4){animation-delay:.24s}.result>*:nth-child(5){animation-delay:.32s}
.lesson,.card{transition:transform .15s}@media (hover:hover){.lesson:hover,.card:not(:disabled):hover{transform:translateY(-2px)}}
.lesson.next .num{animation:glow 1.6s ease-out infinite}
.opt,.tl{transition:transform .1s}.opt:active,.tl:active{transform:scale(.97)}
.snd{border:0;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px}
.lhead .snd{background:none;border:0;font-size:20px;padding:4px}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:50}
.snd,.lhead .x{min-width:44px;min-height:44px}.tl{min-width:44px}
@media (max-height:500px) and (orientation:landscape){.foot{padding-top:8px}.foot .in{display:flex;gap:8px;align-items:center}.foot .fb{flex:1;min-width:0}.foot .btn{padding:10px 14px;width:auto;margin-left:auto}.fb p{margin:2px 0}.foot .fb p.small{display:none}}
@media (min-width:700px){.foot .in{max-width:720px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<div class="foot" id="foot" hidden><div class="in" id="footin"></div></div>

<script>
// Banco de ejercicios ID 1 (Richmond), unidades 1.1–3.4.
// M=opción múltiple (la 1ª opción es la correcta), F=completar, O=ordenar, L=escuchar y escribir,
// S=hablar (say=lo que la app pregunta en voz alta), T=traducir escribiendo. Respuestas: strings o RegExp sobre texto normalizado.
const NAME = "[a-z]+";
const UNITS = [
{ id:"1.1", unit:1, title:"What's your name?", topic:"Saludos y números 1–12",
  tip:`<b>Presentarte:</b> <i>Hi! I'm Ana.</i> / <i>My name is Ana.</i><br><b>Preguntar:</b> <i>What's your name?</i> (what's = what is)<br><b>Saludos:</b> Hello, Hi, Good morning (mañana), Good afternoon (tarde), Good evening (noche). <i>Good night</i> es para despedirse.<br><b>Números 1–12:</b> one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve.`,
  items:[
  M("¿Cómo preguntás el nombre de alguien?",["What's your name?","What your name?","How is your name?"],"En inglés se usa <i>What</i>, no <i>How</i>, y siempre lleva el verbo: What <b>is</b> your name?"),
  M("Son las 9 de la mañana. Saludás:",["Good morning!","Good night!","Good evening!"],"<i>Good morning</i> va hasta el mediodía. <i>Good night</i> solo se usa para despedirse."),
  M("¿Cuál es el número 11?",["eleven","twelve","seven"],"11 = eleven, 12 = twelve."),
  F("Hi! ___ Paula.",["i am","im"],"Para presentarte: <i>I'm</i> o <i>I am</i> + nombre."),
  F("My ___ is Carlos.",["name"],"<i>My name is…</i> = Mi nombre es…"),
  O("Ordená la pregunta","What is your name?"),
  O("Ordená la frase","Nice to meet you."),
  L("Hello, my name is Sam.","Escuchá de nuevo: <i>Hello, my name is Sam.</i>"),
  L("eight, nine, ten","Números: eight (8), nine (9), ten (10)."),
  SP("Respondé la pregunta con tu nombre.","What's your name?",[new RegExp(`^((hi|hello|hey|good (morning|afternoon|evening)) )?(my name is|my names|i am) ${NAME}`)],"Respondé con <i>My name is…</i> o <i>I'm…</i>"),
  SP("Decí en inglés: 'Mucho gusto.'",null,["nice to meet you","nice to meet you too","pleased to meet you","it is nice to meet you","nice meeting you"],"<i>Nice to meet you.</i>"),
  SP("Contá en voz alta del 1 al 5.",null,["one two three four five"],"one, two, three, four, five"),
  ]},
{ id:"1.2", unit:1, title:"Where are you from?", topic:"Origen y presentar a un amigo",
  tip:`<b>Preguntar:</b> <i>Where are you from?</i><br><b>Responder:</b> <i>I'm from Paraguay.</i><br><b>Presentar a alguien:</b> <i>This is my friend, Leo. He's from Brazil.</i><br>Respuesta: <i>Nice to meet you!</i>`,
  items:[
  M("¿Cómo preguntás de dónde es alguien?",["Where are you from?","Where you are from?","From where you are?"],"Orden de pregunta: Where + <b>are</b> + you + from?"),
  M("Presentás a tu amiga María:",["This is María.","He is María.","These is María."],"Para presentar a una persona: <i>This is…</i>"),
  M("'I'm from Brazil.' significa:",["Soy de Brasil.","Voy a Brasil.","Vivo en Brasil."],"<i>be from</i> = ser de (origen)."),
  F("I'm ___ Paraguay.",["from"],"Origen: <i>I'm <b>from</b>…</i>"),
  F("Where ___ you from?",["are"],"Con <i>you</i> el verbo be es <b>are</b>."),
  O("Ordená la pregunta","Where are you from?"),
  O("Ordená la frase","He is from Brazil too."),
  L("I'm from Paraguay.","<i>I'm from Paraguay.</i>"),
  SP("Respondé de dónde sos.","Where are you from?",[/^(i am|im) from [a-z ]+/],"<i>I'm from…</i> + país o ciudad."),
  SP("Presentá a tu amigo Leo.",null,[/^this is (my friend )?leo/],"<i>This is my friend, Leo.</i>"),
  T("Traducí: Soy de Brasil.",["i am from brazil"],"<i>I'm from Brazil.</i>"),
  ]},
{ id:"1.3", unit:1, title:"What's this in English?", topic:"a / an, verbo be, objetos del aula",
  tip:`<b>a / an:</b> <i>a</i> antes de sonido consonante (a book, a pen); <i>an</i> antes de sonido vocal (an eraser, an apple, an umbrella). Cuenta el <b>sonido</b>, no la letra: <i>a university</i> (/yu/), <i>an hour</i>.<br><b>Be (+):</b> It's a pen. You're a student.<br><b>Be (−):</b> It isn't a book. (isn't = is not)<br><b>Pregunta:</b> <i>What's this in English?</i> → <i>It's a notebook.</i><br>Objetos: book, pen, pencil, notebook, eraser, desk, chair, board, bag, phone.`,
  items:[
  M("Completá: It's ___ eraser.",["an","a","—"],"<i>eraser</i> empieza con sonido vocal → <b>an</b>."),
  M("Completá: It's ___ notebook.",["a","an","—"],"<i>notebook</i> empieza con consonante → <b>a</b>."),
  M("Completá: It's ___ umbrella.",["an","a","—"],"<i>umbrella</i> empieza con sonido vocal → <b>an</b>."),
  M("Completá: It's ___ university.",["a","an","—"],"<i>university</i> suena /yu/ (consonante) → <b>a</b>. Cuenta el sonido, no la letra."),
  M("¿Cuál es la forma corta de 'it is not'?",["it isn't","it not","it's no"],"is not = <b>isn't</b>."),
  M("¿Cuál es la forma corta de 'you are'?",["you're","your","you's"],"<i>you're</i> = you are. <i>your</i> = tu/su (posesivo)."),
  F("What's this in English? — It's ___ pen.",["a"],"<i>pen</i> empieza con consonante → <b>a</b>."),
  F("It ___ a book. It's a notebook. (negativo)",["isnt","is not"],"Negativo de <i>it is</i>: <b>it isn't</b>."),
  O("Ordená la pregunta","What is this in English?"),
  O("Ordená la frase","It is not a chair."),
  L("It's an apple.","<i>It's an apple.</i> — <i>an</i> porque apple empieza con vocal."),
  SP("Preguntá cómo se dice algo en inglés.",null,["what is this in english","what is that in english","what is it in english","how do you say this in english"],"<i>What's this in English?</i>"),
  SP("Decí: 'Es una lapicera.'",null,["it is a pen"],"<i>It's a pen.</i>"),
  T("Traducí: No es un libro.",["it is not a book","its not a book"],"<i>It isn't a book.</i>"),
  ]},
{ id:"1.4", unit:1, title:"What's your phone number?", topic:"Alfabeto, deletrear, preguntas con be",
  tip:`<b>Pregunta con be:</b> se invierte el orden → <i>Is it…? Are you…?</i><br><i>Is your name Ana? — Yes, it is. / No, it isn't.</i><br><b>Deletrear:</b> <i>How do you spell that?</i> → <i>M-I-L-L-E-R.</i><br><b>Teléfono:</b> <i>What's your phone number?</i> → <i>It's 0981 234 567.</i> El 0 se dice <i>zero</i> u <i>oh</i>.<br>Letras difíciles: A /ei/, E /i/, I /ai/, G /yi/, J /yei/, H /eich/, W /dabliu/, Y /uai/.`,
  items:[
  M("¿Cómo pedís que deletreen algo?",["How do you spell that?","How you spell that?","What spell is that?"],"<i>How do you spell that?</i>"),
  M("Pregunta correcta:",["Is your name Ana?","Your name is Ana?","Is Ana your name is?"],"En preguntas con be, el verbo va primero: <b>Is</b> your name Ana?"),
  M("Respuesta corta correcta a 'Are you a student?'",["Yes, I am.","Yes, I'm.","Yes, I are."],"En respuestas cortas afirmativas no se contrae: <i>Yes, I am.</i>"),
  M("La letra 'I' en inglés suena como:",["/ai/","/i/","/ei/"],"I = /ai/, E = /i/, A = /ei/."),
  F("What's your phone ___?",["number"],"<i>phone number</i> = número de teléfono."),
  F("___ you from Brazil? — Yes, I am.",["are"],"Pregunta con you: <b>Are</b> you…?"),
  O("Ordená la pregunta","What is your phone number?"),
  O("Ordená la pregunta","How do you spell your name?"),
  L("It's zero nine eight one, two three four.","Teléfono: zero nine eight one, two three four.",[/^(it is )?((zero|oh) nine eight one|nine hundred eighty one) (two three four|two hundred thirty four)$/]),
  L("B-R-O-W-N","Deletreo: B-R-O-W-N.",["brown"]),
  SP("Deletreá la palabra BOOK letra por letra.",null,["B-O-O-K","b o o k","bo ok","book"],"B-O-O-K."),
  SP("Respondé deletreando.","How do you spell your last name?",[/^([a-z] ){2,}[a-z]$/,/^(it is )?[a-z]+$/],"Letra por letra: <i>M-I-L-L-E-R.</i>"),
  T("Traducí: ¿Cuál es tu apellido?",["what is your last name","what is your surname","what is your family name"],"<i>What's your last name?</i> (EE.UU.)"),
  SP("Respondé la pregunta.","Are you a student?",[/^(yes i am|no i am not|no i am (a|an) [a-z]+)\b/],"<i>Yes, I am.</i> o <i>No, I'm not.</i>"),
  T("Traducí: ¿Cuál es tu número de teléfono?",["what is your phone number","what is your telephone number","what is your number","what is your cell phone number"],"<i>What's your phone number?</i>"),
  ]},
{ id:"1.5", unit:1, title:"What's your email address?", topic:"Email, cognados, How are you?",
  tip:`<b>Email:</b> <i>What's your email address?</i> → <i>It's ana dot lopez at gmail dot com.</i><br>@ = <b>at</b>, . = <b>dot</b>, _ = <b>underscore</b>, - = <b>hyphen</b>.<br><b>How are you today?</b> → <i>I'm fine, thanks. And you?</i> / <i>Great! / OK. / Not bad.</i><br><b>Cognados:</b> palabras parecidas al español: hospital, restaurant, hotel, important, computer, telephone, family.`,
  items:[
  M("En un email, '@' se dice:",["at","dot","arroba"],"@ = <b>at</b>."),
  M("En un email, '.' se dice:",["dot","point","at"],". = <b>dot</b>."),
  M("Respuesta a 'How are you today?'",["I'm fine, thanks. And you?","I'm 30 years.","I'm from Paraguay."],"<i>How are you?</i> pregunta cómo estás: <i>I'm fine, thanks.</i>"),
  M("¿Cuál es un cognado de 'computadora'?",["computer","counter","commuter"],"computer ≈ computadora."),
  F("What's your email ___?",["address"],"<i>email address</i> = dirección de correo."),
  F("How ___ you today?",["are"],"<i>How are you?</i>"),
  O("Ordená la pregunta","What is your email address?"),
  O("Ordená la pregunta","How are you today?"),
  L("It's sam at gmail dot com.","<i>sam at gmail dot com</i> = sam@gmail.com",[/^(it is )?sam at gmail (dot )?com$/]),
  SP("Respondé.","How are you today?",[/^(i am )?(fine|great|ok|okay|good|very good|very well|pretty good|well|so so|not bad)\b/],"<i>I'm fine, thanks. And you?</i>"),
  SP("Decí este email en voz alta: ana@gmail.com",null,[/^(it is )?ann?a at gmail (dot )?com$/],"<i>ana at gmail dot com</i>"),
  T("Traducí: ¿Cuál es tu correo electrónico?",["what is your email address","what is your email","what is your e mail address","what is your e mail"],"<i>What's your email address?</i>"),
  ]},
{ id:"2.1", unit:2, title:"Are you a student?", topic:"Países, nacionalidades, I am / you are, números 13–20",
  tip:`<b>I am / You are:</b> I'm a student. You're Brazilian. <b>Negativo:</b> I'm not. You aren't.<br><b>Pronombres:</b> I, you, he, she, it, we, they.<br><b>País → nacionalidad:</b> Brazil → Brazilian, Paraguay → Paraguayan, Argentina → Argentinian, Mexico → Mexican, the USA → American, Spain → Spanish, Japan → Japanese, England → English, Peru → Peruvian.<br>Las nacionalidades van con <b>mayúscula</b>.<br><b>13–20:</b> thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen, twenty.<br><b>Plurales:</b> book → books, country → countries, class → classes.`,
  items:[
  M("Nacionalidad de alguien de Brasil:",["Brazilian","Brazilish","Brasilian"],"Brazil → <b>Brazilian</b> (con z y mayúscula)."),
  M("Nacionalidad de alguien de Japón:",["Japanese","Japanian","Japonese"],"Japan → <b>Japanese</b>."),
  M("Negativo correcto:",["I'm not a teacher.","I amn't a teacher.","I no am a teacher."],"Negativo de I am: <b>I'm not</b>."),
  M("15 en inglés:",["fifteen","fiveteen","fifty"],"15 = <b>fifteen</b>; 50 = fifty."),
  M("Plural de 'country':",["countries","countrys","countryes"],"Consonante + y → <b>-ies</b>."),
  F("You ___ a student. (afirmativo)",["are","re"],"you + <b>are</b>."),
  F("She's from Mexico. She's ___.",["Mexican"],"Mexico → <b>Mexican</b>."),
  O("Ordená la frase","I am not a teacher."),
  O("Ordená la pregunta","Are you a student?"),
  L("thirteen, fourteen, eighteen","13, 14, 18: thirteen, fourteen, eighteen."),
  SP("Respondé.","Are you a student?",[/^(yes i am|no i am not|no i am (a|an) [a-z]+)\b/],"<i>Yes, I am.</i> / <i>No, I'm not.</i>"),
  SP("Decí: 'Soy brasileño.'",null,["i am brazilian"],"<i>I'm Brazilian.</i>"),
  T("Traducí: Vos no sos profesor.",["you are not a teacher","you arent a teacher"],"<i>You aren't a teacher.</i>"),
  ]},
{ id:"2.2", unit:2, title:"Who's your favorite actor?", topic:"He / she / it is, adjetivos de opinión",
  tip:`<b>He / She / It is:</b> He's an actor. She's great. It's terrible.<br><b>Negativo:</b> He isn't / She isn't / It isn't.<br><b>Preguntar favoritos:</b> <i>Who's your favorite actor?</i> (persona) / <i>What's your favorite movie?</i> (cosa)<br><b>Adjetivos de opinión:</b> great, amazing, fantastic, good, OK, bad, terrible, awful, boring, interesting.<br>Inglés americano: <b>favorite</b> (sin u).`,
  items:[
  M("Para preguntar por una PERSONA favorita:",["Who's your favorite singer?","What's your favorite singer?","How's your favorite singer?"],"<b>Who</b> = quién (personas)."),
  M("Para preguntar por una COSA favorita:",["What's your favorite movie?","Who's your favorite movie?","Where's your favorite movie?"],"<b>What</b> = qué/cuál (cosas)."),
  M("Completá: My sister ___ a doctor.",["is","are","am"],"he/she/it → <b>is</b>."),
  M("¿Cuál adjetivo es NEGATIVO?",["terrible","amazing","fantastic"],"terrible = malo. amazing y fantastic son positivos."),
  F("He ___ a good actor. He's terrible. (negativo)",["isnt","is not"],"Negativo: <b>He isn't</b>."),
  F("___ your favorite actor?",["who is","whos"],"Persona → <b>Who's</b>."),
  O("Ordená la pregunta","Who is your favorite actor?"),
  O("Ordená la frase","She is not my teacher."),
  L("He's great. She isn't boring.","<i>He's great. She isn't boring.</i>"),
  SP("Respondé con cualquier actor.","Who's your favorite actor?",[/^(my favou?rite (actor|actress) is|it is|he is|she is|i like) [a-z]+/,/^(?!(i|yes|no|it|my|he|she)\b)[a-z]+( [a-z]+){0,3}$/,/^[a-z]+ [a-z]+ is my favou?rite (actor|actress)$/],"<i>My favorite actor is…</i>"),
  SP("Decí: 'Es fantástico.' (una cosa)",null,["it is fantastic"],"<i>It's fantastic.</i>"),
  T("Traducí: Ella no es aburrida.",["she is not boring","she isnt boring"],"<i>She isn't boring.</i>"),
  ]},
{ id:"2.3", unit:2, title:"Is ceviche Mexican?", topic:"Is he / she / it…?, números 20–100+, edad",
  tip:`<b>Pregunta:</b> <i>Is it Mexican? — No, it isn't. It's Peruvian.</i> / <i>Is she from Spain? — Yes, she is.</i><br><b>Edad:</b> <i>How old are you? — I'm 30.</i> o <i>I'm 30 years old.</i> ❌ Nunca <i>I have 30 years</i>.<br><b>Decenas:</b> twenty, thirty, forty (sin u), fifty, sixty, seventy, eighty, ninety, a/one hundred.<br>21 = twenty-one, 45 = forty-five, 100 = a hundred.<br>Ojo: 13 thir<b>teen</b> vs 30 <b>thir</b>ty.`,
  items:[
  M("¿Cómo decís tu edad?",["I'm 30 years old.","I have 30 years.","I'm 30 years."],"Edad con verbo be: <i>I'm 30</i> o <i>I'm 30 years old</i>."),
  M("Pregunta correcta:",["Is ceviche Mexican?","Ceviche is Mexican?","Is Mexican ceviche is?"],"Verbo primero: <b>Is</b> ceviche Mexican?"),
  M("40 en inglés:",["forty","fourty","fourteen"],"40 = <b>forty</b> (sin u). 14 = fourteen."),
  M("Respuesta corta: 'Is she Brazilian?' (sí)",["Yes, she is.","Yes, she's.","Yes, is she."],"Afirmativo corto sin contraer: <i>Yes, she is.</i>"),
  M("¿Cómo se pregunta la edad?",["How old are you?","How many years you have?","What age you have?"],"<i>How old are you?</i>"),
  F("___ he from Peru? — Yes, he is.",["is"],"he → <b>Is</b> he…?"),
  F("I'm 25 years ___.",["old"],"<i>years old</i>."),
  O("Ordená la pregunta","How old is your brother?"),
  O("Ordená la respuesta","No, it is not. It is Peruvian."),
  L("thirty, forty-five, ninety-nine","30, 45, 99."),
  L("I'm seventy-two years old.","72 = seventy-two."),
  L("My son is thirteen and my father is sixty.","13 vs 30, 16 vs 60: en -teen el acento va al final."),
  SP("Respondé (con cualquier edad).","How old are you?",[new RegExp("^(i am )?(?:(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)(?: (?:one|two|three|four|five|six|seven|eight|nine))?|(?:thir|four|fif|six|seven|eigh|nine)teen|ten|eleven|twelve|(?:a|one) hundred)( years old)?$")],"<i>I'm … years old.</i> ❌ I have … years."),
  SP("Decí el número 68.",null,["sixty eight","68"],"68 = sixty-eight."),
  T("Traducí: ¿Ella es de España? — No.",["Is she from Spain? No, she isn't.","is she from spain no she is not","is she from spain no she isnt","is she from spain no"],"<i>Is she from Spain? — No, she isn't.</i>"),
  ]},
{ id:"2.4", unit:2, title:"Where are your two favorite places?", topic:"You / we / they are, adjetivos",
  tip:`<b>You / We / They are:</b> We're friends. They're from Chile.<br><b>Negativo:</b> We aren't / They aren't.<br><b>Pregunta:</b> <i>Are they nice? — Yes, they are. / No, they aren't.</i><br><b>Adjetivo antes del sustantivo y sin plural:</b> <i>beautiful beaches</i> ❌ beautifuls beaches.<br>Adjetivos: beautiful, big, small, old, new, cheap, expensive, hot, cold, crowded, quiet.`,
  items:[
  M("Completá: My friends ___ from Chile.",["are","is","am"],"Plural (they) → <b>are</b>."),
  M("Orden correcto:",["It's a beautiful city.","It's a city beautiful.","It's beautiful a city."],"En inglés el adjetivo va <b>antes</b> del sustantivo."),
  M("Frase correcta:",["They're big cities.","They're bigs cities.","They're cities bigs."],"Los adjetivos <b>no</b> llevan plural."),
  M("Contrario de 'expensive':",["cheap","old","quiet"],"expensive = caro, cheap = barato."),
  M("Frase correcta:",["It's very hot today.","Is very hot today.","Very hot today is."],"El sujeto es obligatorio: <b>It's</b> hot. ❌ Is hot."),
  F("We ___ friends. We're classmates. (negativo)",["arent","are not"],"Negativo: <b>We aren't</b>."),
  F("___ they from Argentina? — Yes, they are.",["are"],"they → <b>Are</b> they…?"),
  O("Ordená la pregunta","Where are your two favorite places?"),
  O("Ordená la frase","They are not expensive."),
  L("We're from Asunción. It's hot.","<i>We're from Asunción. It's hot.</i>"),
  SP("Respondé (cualquier lugar).","Where are your two favorite places?",[/^(my (two )?favorite places are |they are )?[a-z ]+ and [a-z ]+/],"<i>My favorite places are … and ….</i>"),
  SP("Decí: 'Somos estudiantes.'",null,["we are students"],"<i>We're students.</i>"),
  T("Traducí: Ellos no son caros.",["they are not expensive","they arent expensive"],"<i>They aren't expensive.</i>"),
  ]},
{ id:"2.5", unit:2, title:"Is English essential for your future?", topic:"Cognados, información de otras personas",
  tip:`<b>Cognados:</b> essential, important, future, interesting, possible, necessary, university, music, family, problem.<br>Ojo con falsos amigos: <i>actually</i> = en realidad (no 'actualmente'), <i>library</i> = biblioteca (no 'librería').<br><b>Hablar de otros:</b> <i>His name is Tom. He's 20. He's from Canada.</i><br><i>Her name is Lia. She's a student.</i><br><b>His</b> = de él, <b>Her</b> = de ella.`,
  items:[
  M("'Library' significa:",["biblioteca","librería","laboratorio"],"Falso amigo: <i>library</i> = biblioteca. Librería = bookstore."),
  M("'Actually' significa:",["en realidad","actualmente","activamente"],"Falso amigo: <i>actually</i> = en realidad."),
  M("Completá: ___ name is Tom. He's 20.",["His","Her","He"],"de él → <b>His</b>."),
  M("Completá: ___ name is Lia. She's a student.",["Her","His","She"],"de ella → <b>Her</b>."),
  F("English is ___ for my future. (esencial)",["essential"],"<i>essential</i> = esencial."),
  F("How old ___ she? — She's 19.",["is"],"she → <b>is</b>."),
  O("Ordená la pregunta","Is English essential for your future?"),
  O("Ordená la pregunta","How old is her brother?"),
  L("English is important for my job.","<i>English is important for my job.</i>"),
  SP("Respondé.","Is English essential for your future?",[/^(yes|no|yeah|of course)\b/],"<i>Yes, it is.</i> / <i>Yes, it's very important.</i>"),
  SP("Contá de un amigo: nombre Tom, 20 años.",null,[/^(his name is|he is|this is( my friend)?|my friends? name is) tom\b.*\btwenty\b/],"<i>His name is Tom. He's twenty.</i>"),
  T("Traducí: Su nombre (de ella) es Ana.",["her name is ana","her names ana"],"<i>Her name is Ana.</i>"),
  ]},
{ id:"3.1", unit:3, title:"What do you do?", topic:"Trabajos, sufijos, a/an + trabajo, plurales",
  tip:`<b>Preguntar trabajo:</b> <i>What do you do?</i> → <i>I'm <b>a</b> teacher.</i> / <i>I'm <b>an</b> engineer.</i><br>En inglés el trabajo <b>siempre</b> lleva a/an ❌ I'm teacher.<br><b>Sufijos:</b> teach<b>er</b>, act<b>or</b>, art<b>ist</b>, music<b>ian</b>, account<b>ant</b>, manag<b>er</b>, dent<b>ist</b>.<br><b>Plurales irregulares:</b> man → men, woman → women, person → people, child → children.`,
  items:[
  M("Frase correcta:",["I'm an engineer.","I'm engineer.","I'm a engineer."],"Trabajo con artículo; <i>engineer</i> empieza con vocal → <b>an</b>."),
  M("¿Qué pregunta 'What do you do?'",["¿A qué te dedicás?","¿Qué estás haciendo?","¿Qué hacés hoy?"],"<i>What do you do?</i> = ¿Cuál es tu trabajo?"),
  M("Persona que toca música:",["musician","musicer","musicist"],"music + <b>-ian</b>."),
  M("Plural de 'woman':",["women","womans","womens"],"Irregular: woman → <b>women</b>."),
  M("Plural de 'person':",["people","persones","peoples'"],"Irregular: person → <b>people</b>."),
  M("Completá: The people in my office ___ nice.",["are","is","am"],"<i>people</i> es plural → <b>are</b>. ❌ people is."),
  F("She's ___ accountant.",["an"],"accountant empieza con vocal → <b>an</b>."),
  F("What do you ___? — I'm a manager.",["do"],"<i>What do you <b>do</b>?</i>"),
  O("Ordená la pregunta","What do you do?"),
  O("Ordená la frase","They are doctors."),
  L("I'm a nurse. He's an actor.","<i>I'm a nurse. He's an actor.</i>"),
  SP("Respondé con un trabajo (con a/an).","What do you do?",[/^i am (a (?!unemployed)([b-df-hj-np-tv-z]|u|eu)|an (?!unemployed)([aeiou]|hour|honest))[a-z ]*/],"<i>I'm a/an …</i> (¡no olvides el artículo!)"),
  SP("Decí: 'Ella es dentista.'",null,["she is a dentist"],"<i>She's a dentist.</i>"),
  T("Traducí: Soy gerente.",["i am a manager"],"<i>I'm a manager.</i> (con artículo)"),
  ]},
{ id:"3.2", unit:3, title:"Do you have brothers and sisters?", topic:"Familia, presente simple I/you/we/they, posesivos",
  tip:`<b>Presente simple (I/you/we/they):</b> I have a sister. ❌ I has.<br><b>Negativo:</b> I <b>don't</b> have a brother. (don't = do not)<br><b>Pregunta:</b> <i><b>Do</b> you have kids? — Yes, I do. / No, I don't.</i><br><b>Familia:</b> mother, father, parents, brother, sister, son, daughter, husband, wife, grandmother, grandfather, uncle, aunt, cousin.<br><b>Posesivos:</b> my, your, his, her, its, our, their.<br><b>'s</b> para 'de alguien': <i>my father's car</i> (❌ the car of my father).`,
  items:[
  M("Pregunta correcta:",["Do you have brothers and sisters?","Have you brothers and sisters?","You have brothers and sisters?"],"Presente simple: <b>Do</b> + you + have…?"),
  M("Negativo correcto:",["I don't have a sister.","I not have a sister.","I haven't a sister."],"Negativo: <b>don't</b> + verbo."),
  M("La hija de tu tío es tu:",["cousin","niece","aunt"],"primo/a = <b>cousin</b>."),
  M("Completá: We love ___ parents.",["our","we","us"],"we → posesivo <b>our</b>."),
  M("'El auto de mi padre' en inglés:",["my father's car","the car of my father","my father car"],"Posesivo con <b>'s</b>: <i>my father's car</i>. ❌ the car of my father."),
  F("My ___ name is Rosa. (de mi mamá)",["mother's","moms","mom's","mothers"],"Posesivo: <i>my mother's name</i>."),
  M("Respuesta corta: 'Do you have kids?' (no)",["No, I don't.","No, I not.","No, I haven't."],"<i>No, I don't.</i>"),
  F("They ___ have a car. (negativo)",["dont","do not"],"Negativo: <b>don't</b>."),
  F("___ you have a brother? — Yes, I do.",["do"],"Pregunta: <b>Do</b> you…?"),
  O("Ordená la pregunta","Do you have brothers and sisters?"),
  O("Ordená la frase","I do not have a brother."),
  L("I have two sisters and one brother.","<i>I have two sisters and one brother.</i>"),
  SP("Respondé.","Do you have brothers and sisters?",[/^(yes|no|yeah|i have|i do not have)\b/],"<i>Yes, I do. I have…</i> / <i>No, I don't.</i>"),
  SP("Decí: 'Ellos son mis padres.'",null,["they are my parents"],"<i>They're my parents.</i>"),
  T("Traducí: No tengo hijos.",["i do not have children",/^i (do not have (any )?(children|kids)|have no (children|kids))$/],"<i>I don't have children/kids.</i>"),

{ id:"3.3", unit:3, title:"Do you have a job?", topic:"Lugares de trabajo, preguntas en presente simple",

function M(q,opts,expl){return{t:"mc",q,opts,expl}}
function F(q,a,expl){return{t:"fill",q,a,expl}}
function O(q,a){return{t:"order",q,a,expl:`Orden correcto: <i>${a}</i>`}}
function L(say,expl,alt=[]){return{t:"listen",q:"Escuchá y escribí lo que oís",say,a:[say,...alt],expl}}
function SP(q,say,a,expl){return{t:"speak",q,say,a,expl}}
function T(q,a,expl){return{t:"translate",q,a,expl}}

function FIX(wrong,model,alts,expl){return{t:"fix",q:wrong,m:model,a:[model,...(alts||[])],expl}}
function DLG(dlg,q,opts,expl){return{t:"mc",dlg,q,opts,expl}}

/* ---------- normalización y corrección ---------- */
const ONES="zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen".split(" ");
const TENS=",,twenty,thirty,forty,fifty,sixty,seventy,eighty,ninety".split(",");
function numWords(n){n=+n;if(n<20)return ONES[n];if(n<100)return TENS[n/10|0]+(n%10?" "+ONES[n%10]:"");if(n<1000)return ONES[n/100|0]+" hundred"+(n%100?" "+numWords(n%100):"");return String(n).split("").map(d=>ONES[d]).join(" ")}
const CONTR={"name's":"name is","i'm":"i am","im":"i am","you're":"you are","youre":"you are","he's":"he is","hes":"he is","she's":"she is","shes":"she is","it's":"it is","its":"it is","we're":"we are","they're":"they are","theyre":"they are","what's":"what is","whats":"what is","who's":"who is","whos":"who is","where's":"where is","wheres":"where is","there's":"there is","theres":"there is","that's":"that is","thats":"that is","isn't":"is not","isnt":"is not","aren't":"are not","arent":"are not","don't":"do not","dont":"do not","doesn't":"does not","doesnt":"does not","i'm not":"i am not","can't":"can not","cant":"can not","cannot":"can not","o'clock":"oclock","o clock":"oclock"};
function norm(s){
  s=String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’‘`´]/g,"'");
  s=s.replace(/o\s*'?\s*clock/g,"oclock").replace(/(\d{1,2}):(\d{2})/g,(m,h,mm)=>numWords(h)+" "+(mm==="00"?"oclock":(+mm<10?"oh "+numWords(+mm):numWords(mm))));
  s=s.replace(/@([a-z0-9.]*[a-z0-9])/g,(m,d)=>" at "+d.replace(/\./g," dot ")+" ").replace(/\b(\d+) ?([ap])\.? ?m\b\.?/g,"$1 $2m").replace(/[-–—_/.,!?;:"()¿¡]/g," ");
  s=s.replace(/\d+/g,d=>" "+(d[0]==="0"&&d.length>1||d.length>3?d.split("").map(x=>ONES[x]).join(" "):numWords(d))+" ");
  s=s.split(/\s+/).map(w=>CONTR[w]||w).join(" ").replace(/'/g,"");
  return s.replace(/\s+/g," ").trim();
}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
// typo = una sola palabra de contenido mal escrita; nunca perdona errores de gramática (artículos, -s, this/these…)
const FUNC=new Set("a an the in at on to this that these those is are am do does has have he she it they we you i his her my your our their not".split(" "));
function isTypo(n,r){const A=n.split(" "),B=r.split(" ");if(A.length!==B.length)return false;let d=0;for(let i=0;i<A.length;i++){const x=A[i],y=B[i];if(x===y)continue;if(++d>1||FUNC.has(x)||FUNC.has(y)||x.length<4||"un"+x===y||"un"+y===x||x+"s"===y||y+"s"===x||x+"es"===y||y+"es"===x||lev(x,y)>Math.max(1,x.length/5|0))return false}return d===1}
// devuelve "ok" | "typo" | "bad"
function grade(it,resp){
  if(it.t==="mc")return resp===it.opts[0]?"ok":"bad";
  const r=norm(resp); if(!r)return "bad";
  const acc=it.t==="order"?[it.a]:it.a;
  for(const a of acc){ if(a instanceof RegExp){ if(a.test(r))return "ok"} else if(norm(a)===r)return "ok" }
  if(it.t==="listen"&&acc.some(a=>typeof a==="string"&&norm(a).replace(/ /g,"")===r.replace(/ /g,"")))return "ok";
  if(it.t!=="fill") for(const a of acc){ if(typeof a==="string"){const n=norm(a);if(n.length>10&&isTypo(n,r))return "typo"} }
  return "bad";
}
function correctText(it){
  if(it.m)return it.m;
  if(["translate","speak","fix"].includes(it.t)){const ex=(it.expl||"").match(/<i>(.*?)<\/i>/);if(ex){const s=ex[1].replace(/<[^>]+>/g,"").trim();if(s&&!/…|\.\.\.|\//.test(s)&&grade(it,s)!=="bad")return s}} // modelo con puntuación desde la explicación
  if(it.t==="mc")return it.opts[0];
  if(it.t==="order")return it.a;
  if(it.t==="listen")return it.say;
  const x=it.a.find(a=>typeof a==="string"); if(!x)return null;
  if(it.t==="fill")return x.replace(/^isnt$/,"isn't").replace(/^arent$/,"aren't").replace(/^dont$/,"don't").replace(/^doesnt$/,"doesn't").replace(/^whos$/,"who's").replace(/^oclock$/,"o'clock").replace(/^im$/,"I'm").replace(/\bi\b/g,"I");
  const t=x.replace(/\bi\b/g,"I").replace(/\batm\b/g,"ATM").replace(/\b(brazil|brazilian|spain|paraguay|ana|leo|tom|english|sunday)\b/g,w=>w[0].toUpperCase()+w.slice(1)).replace(/^([a-z]) ([a-z]) /,(m)=>m.toUpperCase().replace(/ /g,"-"));
  return t.charAt(0).toUpperCase()+t.slice(1);
}

  if(it.t==="listen")h+=`<div class="say"><button class="spk" aria-label="Escuchar" onclick="speak(cur().say)">🔊</button><button class="spk slow" aria-label="Escuchar lento" onclick="speak(cur().say,.6)">lento</button></div>`;
  if(it.t==="speak"&&it.say)h+=`<div class="say"><button class="spk" aria-label="Escuchar pregunta" onclick="speak(cur().say)">🔊</button><span class="saytxt">“${esc(it.say)}”</span></div>`;
  if(it.t==="mc"){ const opts=shuffle(it.opts); h+=`<div class="opts">`+opts.map((o,i)=>`<button class="opt" aria-pressed="false" data-o="${esc(o)}"><span class="key">${i+1}</span>${esc(o)}</button>`).join("")+`</div>` }
  else if(it.t==="order"){ const words=it.a.replace(/[.?!,]/g,"").split(" "); h+=`<div class="tiles" id="tiles" aria-label="Tu respuesta"></div><div class="bank">`+shuffle(words.map((w,i)=>({w,i}))).map(o=>`<button class="tl" data-i="${o.i}">${esc(o.w)}</button>`).join("")+`</div>` }
  else { h+=`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="${it.t==="fill"?"Palabra que falta":it.t==="speak"?"Hablá o escribí tu respuesta":it.t==="fix"?"Escribí la frase corregida":"Escribí en inglés"}">`;
    if(it.t==="speak")h+=`<div class="mic">${micBlocked?"":`<button class="btn" id="micb" style="flex:1">🎤 Tocá y hablá</button>`}</div><p class="hint">${micBlocked?DICT:"Si el micrófono no anda, usá el dictado del teclado en el campo de arriba."}</p>` }
  app.innerHTML=h+"</div>"; S.beat=false;
  requestAnimationFrame(()=>{const b=app.querySelector(".lhead .bar i");if(b)b.style.width=pct+"%";S.lastPct=pct});
  showFoot("",`<button class="btn" id="chk" disabled onclick="check()">Comprobar</button>`);
  const chk=$("#chk"), set=v=>{resp=v;chk.disabled=!(v&&String(v).trim())};
  if(it.t==="mc")app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{sfx("tap");app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");set(b.dataset.o)});
  else if(it.t==="order"){ const tiles=$("#tiles"), words=it.a.replace(/[.?!,]/g,"").split(" "), seq=[];
    const upd=()=>{tiles.innerHTML=seq.map((i,k)=>`<button class="tl" data-k="${k}">${esc(words[i])}</button>`).join("");tiles.querySelectorAll(".tl").forEach(b=>b.onclick=()=>{const i=seq.splice(+b.dataset.k,1)[0];app.querySelector(`.bank .tl[data-i="${i}"]`).classList.remove("used");upd()});set(seq.length===words.length?seq.map(i=>words[i]).join(" "):"")};
    app.querySelectorAll(".bank .tl").forEach(b=>b.onclick=()=>{if(b.classList.contains("used"))return;b.classList.add("used");seq.push(+b.dataset.i);upd()}) }
  else { const a=$("#ans"); a.oninput=()=>set(a.value); a.onkeydown=e=>{if(e.key!=="Enter")return;e.preventDefault();if(chk.isConnected){if(!chk.disabled)check()}else if(!$("#qc"))footin.querySelector(".btn")?.click()}; if(it.t!=="speak"||matchMedia("(pointer:fine)").matches)a.focus({preventScroll:true}); a.onfocus=()=>setTimeout(()=>a.scrollIntoView({block:"center",behavior:"smooth"}),300);
    const mb=$("#micb"); if(mb)mb.onclick=()=>{ if(mb.classList.contains("on")){try{rec?.stop()}catch(e){}return} mb.classList.add("on");mb.textContent="Escuchando…";
      const ok=listen(alts=>{const best=alts.find(t=>grade(it,t)!=="bad")||alts[0];a.value=best;set(best)},st=>{mb.classList.remove("on");mb.textContent="🎤 Tocá y hablá";if(st==="blocked"){mb.remove();$(".hint").innerHTML=DICT}else if(st==="error")$(".hint").textContent="No te escuché. Tocá y hablá de nuevo, más cerca del micrófono."});
      if(!ok){mb.remove();$(".hint").innerHTML=DICT} } }
  if(it.t==="mc"||it.t==="order")document.onkeydown=e=>{const c=$("#chk");if($("#qc")){if(e.key==="Escape")$("#qc .btn.ghost").click();return}if(!c){const fb=footin.querySelector(".btn");if(e.key==="Enter"&&fb&&document.activeElement!==fb){e.preventDefault();fb.click()}return}if(e.key==="Enter"&&!c.disabled){e.preventDefault();check()}else if(it.t==="mc"){const b=app.querySelectorAll(".opt")[e.key-1];if(b)b.click()}};
  window.scrollTo(0,0);
  if(it.t==="listen"||(it.t==="speak"&&it.say))speak(it.say);
  if(it.dlg&&S.lastDlg!==it.dlg){S.lastDlg=it.dlg;setTimeout(()=>playDialog(it.dlg),300)}
}
function showFoot(cls,html){foot.className="foot "+cls;footin.innerHTML=html;foot.hidden=false;requestAnimationFrame(()=>{app.style.paddingBottom=foot.offsetHeight+16+"px";const a=$("#ans");if(cls&&a&&document.activeElement===a){const d=a.getBoundingClientRect().bottom-foot.getBoundingClientRect().top+8;if(d>0)scrollBy(0,d)}});if(document.activeElement?.id!=="ans")footin.querySelector(".btn:not(:disabled)")?.focus({preventScroll:true})}
function check(){
  const it=cur(), g=grade(it,resp), firstTry=!S.retry;
  if(S.mode==="exam"){ S.results.push({key:it.key,resp,ok:g!=="bad"}); S.idx++; ls.set("o2o:exam:"+me,S);
    if(S.idx>=S.queue.length)return finishExam(); return render() }
  if(it.t==="mc")app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(b.dataset.o===it.opts[0])b.classList.add("right");else if(b.getAttribute("aria-pressed")==="true")b.classList.add("wrong")});
  if(g!=="bad"){
    if(firstTry){S.xp+=S.first[it.key]?5:10;if(!S.first[it.key])P.missed=P.missed.filter(k=>k!==it.key);S.streak=(S.streak||0)+1;S.best=Math.max(S.best||0,S.streak)} else {S.xp+=3;S.streak=0}
    const st=S.streak, bonus=firstTry&&st>=3&&(st===3||st%5===0)?(st>=10?10:5):0; S.xp+=bonus;
    const streakTag=firstTry&&st>=3?`<span class="streak"><b>🔥</b> ${st} seguidas${bonus?` · +${bonus} XP`:""}${st>=5?" · On fire!":""}</span>`:"";
    sfx(bonus?"streak":"ok"); $("#qb")?.classList.add("pop");
    const note=g==="typo"?`<p>Casi perfecto, revisá la ortografía: <b>${esc(correctText(it))}</b></p>`:(it.t==="speak"||it.t==="translate"||it.t==="fix")&&correctText(it)?`<p class="small">Modelo: <i>${esc(correctText(it))}</i></p>`:"";
    showFoot("ok",`<div class="fb"><h3>${PRAISE[Math.random()*PRAISE.length|0]}</h3>${streakTag}${note}</div><button class="btn" onclick="nextQ()">Continuar</button>`); if(it.dlg&&$("#qb"))$("#qb").insertAdjacentHTML("beforeend",transcript(it));
    if(["order","translate","speak","fix"].includes(it.t)&&correctText(it))speak(correctText(it));
  } else {
    sfx("bad"); S.streak=0; const qb=$("#qb"); if(qb){qb.classList.remove("shake");void qb.offsetWidth;qb.classList.add("shake")}
    if(firstTry){ S.first[it.key]=1; S.mistakes++; if(S.hearts!=null){S.hearts--;const hh=$(".hearts");if(hh){hh.textContent="♥ "+S.hearts;hh.classList.remove("beat");void hh.offsetWidth;hh.classList.add("beat")}} if(!P.missed.includes(it.key))P.missed.push(it.key); S.queue.push(it.key) }
    const ct=correctText(it);
    showFoot("bad",`<div class="fb"><h3>No es correcto <span style="font-weight:600;white-space:nowrap">· ${CHEER[Math.random()*CHEER.length|0]}</span></h3>${ct?`<p>Respuesta correcta: <b>${esc(ct)}</b></p>`:""}<p class="small">${it.expl}</p></div><button class="btn" onclick="retryQ()">${S.hearts===0?"Ver resultado":"Intentar de nuevo"}</button>`); if(it.dlg&&$("#qb"))$("#qb").insertAdjacentHTML("beforeend",transcript(it));
    if(ct&&!/[ñ¿¡]|(^|[^a-záéíóúñ])(es|el|la|los|las|que|cree|muy|está|chicas|grandes|soy|de|del|en|un|una|unos|su|con|y|sabe|mozo|más|menos|él|sí|tú|qué|cuál|biblioteca|realidad|actualmente|futbolista)(?![a-záéíóúñ])/i.test(ct))speak(ct,.9); // no leer en voz inglesa respuestas en español
  }
  save();
}
function retryQ(){ if(S.hearts===0){view="end";S.failed=true;return render()} S.retry=true; vQ() }
function nextQ(){ S.retry=false; S.idx++; if(S.idx>=S.queue.length){view="end";return render()} vQ() }
function quit(){ if($("#qc"))return; const ex=S.mode==="exam";
  [...footin.children].forEach(c=>c.hidden=true);
  footin.insertAdjacentHTML("beforeend",`<div id="qc" style="display:grid;gap:10px"><p style="margin:0">${ex?"¿Salir del test de prueba? Tu avance queda guardado y podés continuarlo desde el inicio.":"¿Salir de la lección? Vas a perder el avance de esta lección."}</p><button class="btn red" onclick="go('home')">Salir</button><button class="btn ghost" onclick="$('#qc').remove();[...footin.children].forEach(c=>c.hidden=false)">Seguir practicando</button></div>`); $("#qc .btn.ghost").focus() }
function vEnd(){
  if(S.failed){ save(); app.innerHTML=`<div class="result"><div class="big">♥ 0</div><h2>Te quedaste sin vidas</h2><p class="muted">Los errores quedaron guardados en "Repasar mis errores". Volvé a leer el tip y repetí la lección.</p></div>`;
    showFoot("",`<button class="btn red" onclick="${S.mode==="lesson"?`openTip('${S.lessonId}')`:"startReview()"}">Repetir</button><button class="btn ghost" onclick="go('home')">Volver al inicio</button>`); return }
  const st=S.mistakes===0?3:S.mistakes<=2?2:1; S.xp+=st*5; P.xp+=S.xp;
  if(S.mode==="lesson"){P.done[S.lessonId]=Math.max(P.done[S.lessonId]||0,st); markSeen(LESSONS.find(x=>x.id===S.lessonId),[...new Set(S.queue)]);
    if(LESSONS.every(l=>(P.round||[]).includes(l.id))){P.round=[];P.rounds=(P.rounds||0)+1} // ronda anterior ya completa: empieza otra
    P.round=[...new Set([...(P.round||[]),S.lessonId])]} save();
  const roundDone=S.mode==="lesson"&&LESSONS.every(l=>P.round.includes(l.id));
  const nextL=S.mode==="lesson"?LESSONS[LESSONS.findIndex(l=>l.id===S.lessonId)+1]:null;
  app.innerHTML=`<div class="result"><div class="stars" style="font-size:44px">${stars(st)}</div><h2>${S.mode==="lesson"?"¡Lección "+S.lessonId+" completa!":"¡Repaso completo!"}</h2>
  <div class="big" id="xpn" data-pre="+" data-suf=" XP">+0 XP</div>${S.best>=3?`<p style="margin:0"><span class="streak"><b>🔥</b> Mejor racha: ${S.best} seguidas</span></p>`:""}<p class="muted">${S.mistakes?`Te equivocaste ${S.mistakes} ${S.mistakes===1?"vez":"veces"}. Esos ejercicios quedaron en "Repasar mis errores".`:"Sin errores. ¡Perfecto!"}</p></div>`;
  if(roundDone)app.querySelector(".result").insertAdjacentHTML("beforeend",`<div class="tipcard" style="text-align:center"><h2 style="margin:0 0 4px">🎉 ¡Ronda completa!</h2><p class="muted" style="margin:0">Hiciste las ${LESSONS.length} lecciones. ¿Te animás a un test de prueba como el examen, o preferís seguir practicando?</p></div>`);
  if(roundDone)showFoot("",`<button class="btn red" onclick="startExam()">Hacer el test de prueba (60 preguntas, 20–25 min)</button><button class="btn ghost" onclick="newRound()">Seguir practicando: otra ronda con preguntas nuevas</button><button class="btn ghost" onclick="go('home')">Inicio</button>`); else
  showFoot("",(nextL?`<button class="btn red" onclick="openTip('${nextL.id}')">Siguiente: ${nextL.id}</button>`:"")+(S.mode==="lesson"||P.missed.length?`<button class="btn ghost" onclick="${S.mode==="lesson"?`openTip('${S.lessonId}')`:"startReview()"}">Repetir</button>`:"")+`<button class="btn ghost" onclick="go('home')">Inicio</button>`);
  sfx("done"); confetti(); countUp($("#xpn"),S.xp) }
function finishExam(){ const ok=S.results.filter(r=>r.ok).length, pct=Math.round(ok/S.results.length*100);
  S.results.filter(r=>!r.ok).forEach(r=>{if(!P.missed.includes(r.key))P.missed.push(r.key)});
  S.record=pct>(P.exam.best??-1); P.exam.tries++; P.exam.last=pct; P.exam.hist=[...(P.exam.hist||[]),pct].slice(-8); P.exam.best=Math.max(P.exam.best??0,pct); P.xp+=ok; save(); ls.set("o2o:exam:"+me,null); view="examEnd"; render() }
function vExamEnd(){
  const bad=S.results.filter(r=>!r.ok), ok=S.results.length-bad.length, pct=Math.round(ok/S.results.length*100);
  const weak={}; bad.forEach(r=>{const l=ITEM[r.key].lesson;weak[l]=(weak[l]||0)+1});
  const wk=Object.entries(weak).sort((a,b)=>b[1]-a[1]);
  app.innerHTML=`<div class="result"><p class="muted" style="margin:0">Test de prueba</p><div class="big" id="pctn" data-pre="" data-suf="%">0%</div><h2>${ok} de ${S.results.length} correctas</h2>${S.record?'<p style="margin:0"><span class="streak"><b>🏆</b> ¡Nuevo récord!</span></p>':""}
  <p class="muted">${pct>=85?"¡Listo para el examen!":pct>=70?"Muy bien. Repasá los temas marcados.":pct>=60?"¡Aprobado! Repasá los temas marcados para subir la nota.":"Repasá los temas marcados y volvé a intentarlo."}</p>
  ${wk.length?`<div><p class="small muted" style="margin:0 0 6px">Temas para repasar (errores)</p>${wk.map(([l,n])=>`<span class="wkpill">${l} · ${esc(LESSONS.find(x=>x.id===l).title)} (${n})</span>`).join("")}</div>`:""}
  ${bad.length?`<h3 style="text-align:left;margin-top:10px">Tus errores</h3><div class="review">${bad.map(r=>{const it=ITEM[r.key],ct=correctText(it);return `<div><span class="small muted">${it.lesson} · ${TYPE[it.t]}</span><br><b>${esc(it.q)}</b>${it.say&&it.t==="speak"?`<br><i>“${esc(it.say)}”</i>`:""}<br><span style="color:var(--bad)">Tu respuesta: ${esc(r.resp||"—")}</span>${ct?`<br><span style="color:var(--ok)">Correcta: ${esc(ct)}</span>`:""}<br><span class="small">${it.expl}</span>${transcript(it)}</div>`}).join("")}</div>`:""}</div>`;
  showFoot("",`${bad.length?`<button class="btn red" onclick="startReview()">Repasar mis errores</button>`:""}<button class="btn ghost" onclick="startExam()">Repetir test de prueba</button><button class="btn ghost" onclick="go('home')">Inicio</button>`) ; sfx(pct>=60?"done":"ok"); if(pct>=60)confetti(); countUp($("#pctn"),pct) }

/* ---------- arranque ---------- */
// Safari iOS ignora interactive-widget: subir la barra inferior por encima del teclado
if(window.visualViewport){const vv=visualViewport,f=()=>foot.style.bottom=Math.max(0,innerHeight-vv.height-vv.offsetTop)+"px";vv.addEventListener("resize",f);vv.addEventListener("scroll",f)}
me=ls.get("o2o:me"); if(me){P=ls.get("o2o:p:"+me);if(P){P=merge(P,blank(P.name));view="home"}else me=null}
addEventListener("popstate",()=>{ if(view==="home"||view==="login")return; try{history.pushState(1,"")}catch(e){} view==="q"?quit():go("home") });
render();

// autochequeo de la corrección
console.assert(grade({t:"fill",a:["isnt","is not"]},"isn't")==="ok","fill contraction");
console.assert(grade({t:"speak",a:[/^(i am |im )from [a-z ]+/]},"I'm from Paraguay.")==="ok","speak regex");
console.assert(grade({t:"speak",a:[/^i (usually )?get up at [a-z0-9: ]+/]},"I get up at 6:30")==="ok","times");
console.assert(grade({t:"order",a:"What is your name?"},"What is your name")==="ok","order");
console.assert(grade({t:"mc",opts:["a","b"]},"b")==="bad","mc");
console.assert(grade({t:"translate",a:["my father does not work"]},"My father doesnt works")==="bad","no typo pass for -s");
console.assert(grade({t:"translate",a:["i am a manager"]},"I am a manajer")==="typo","real typo");
console.assert(norm("It's a quarter past nine")==="it is a quarter past nine","norm");
console.assert(norm("It's sam@gmail.com")==="it is sam at gmail dot com","email");
console.assert(norm("0981 234")==="zero nine eight one two hundred thirty four","phone digits");
console.assert(norm("at 10 p.m.")==="at ten pm","pm");
